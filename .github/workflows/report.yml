# 平日の夕方（日本時間16:40頃）にレポートを作り直して GitHub Pages に公開する
name: daily-report

on:
  schedule:
    - cron: "40 7 * * 1-5"   # UTC 7:40 = 日本時間 16:40（月〜金）
  workflow_dispatch:          # 手動実行ボタン

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python make_html.py --out site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
