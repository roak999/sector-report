# 平日の夕方（日本時間16:40頃）にレポートを作り直して GitHub Pages に公開する
name: daily-report

on:
  schedule:
    - cron: "40 7 * * 1-5"   # UTC 7:40 = 日本時間 16:40（月〜金）
  workflow_dispatch:          # 手動実行ボタン

permissions:
  contents: write            # 「今日注目する銘柄」の履歴(history/picks.json)をリポジトリに保存するため
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false  # 履歴の保存中に実行が打ち切られないようにする（後の実行は順番待ち）

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python make_html.py --out site/index.html
      # 注目銘柄の履歴を保存する（変更があったときだけ）。失敗してもページの公開は続ける
      - name: save pick history
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history/picks.json
          if git diff --cached --quiet; then
            echo "履歴に変更なし"
          else
            git commit -m "chore: update pick history"
            git pull --rebase
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
